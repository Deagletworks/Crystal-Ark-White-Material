version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: c_rome_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - telemetry_net

  grafana:
    image: grafana/grafana:latest
    container_name: c_rome_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin # 初期ログインパスワード
    volumes:
      - ./grafana_datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    networks:
      - telemetry_net
    depends_on:
      - prometheus

networks:
  telemetry_net:
    driver: bridge
