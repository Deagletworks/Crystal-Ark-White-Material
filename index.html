<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QPU-EXTREME-2 Frontend</title>
    <style>
        body { background-color: #0b0f19; color: #00ffcc; font-family: monospace; padding: 20px; }
        h1 { border-bottom: 2px solid #00ffcc; padding-bottom: 10px; font-size: 1.5rem; text-shadow: 0 0 10px #00ffcc; }
        .control-group { background: #161f33; padding: 15px; border-radius: 8px; border: 1px solid #1f2d4d; margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #8fa0c4; font-size: 0.9rem; }
        .val { float: right; color: #ffffff; font-weight: bold; }
        input[type=range] { width: 100%; height: 8px; background: #0b0f19; border-radius: 5px; outline: none; -webkit-appearance: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; background: #00ffcc; border-radius: 50%; cursor: pointer; box-shadow: 0 0 8px #00ffcc; }
        button { width: 100%; padding: 15px; background: linear-gradient(135deg, #00ffcc, #0099ff); border: none; color: #0b0f19; font-weight: bold; font-size: 1.1rem; border-radius: 8px; cursor: pointer; box-shadow: 0 0 15px rgba(0,255,204,0.4); margin-top: 10px; }
        button:active { transform: scale(0.98); }
        #console { background: #000; color: #00ff66; padding: 10px; border-radius: 5px; font-size: 0.8rem; height: 120px; overflow-y: auto; border: 1px solid #00ff66; margin-top: 15px; }
    </style>
</head>
<body>

    <h1>⚡ QPU-EXTREME-2 物理位相設計端末</h1>

    <!-- 4連波動スライダー（マルチフェロイック膜アナログ入力マッピング） -->
    <div class="control-group">
        <h3>🌌 ① 環境時空波動アナログ入力（4ビット幅: 0〜15）</h3>
        <label>原始情報 (flash_atc_wave_m): <span id="m_val" class="val">8</span></label>
        <input type="range" id="wave_m" min="0" max="15" value="8" oninput="updateVal('m', this.value)">
        
        <label style="margin-top:10px;">空間座標 (flash_atc_wave_ui): <span id="ui_val" class="val">4</span></label>
        <input type="range" id="wave_ui" min="0" max="15" value="4" oninput="updateVal('ui', this.value)">
        
        <label style="margin-top:10px;">揺らぎ量 (flash_atc_wave_ej): <span id="ej_val" class="val">2</span></label>
        <input type="range" id="wave_ej" min="0" max="15" value="2" oninput="updateVal('ej', this.value)">
        
        <label style="margin-top:10px;">歳入予算 (flash_atc_wave_ek): <span id="ek_val" class="val">1</span></label>
        <input type="range" id="wave_ek" min="0" max="15" value="1" oninput="updateVal('ek', this.value)">
    </div>

    <!-- 音声コマンド聞き取り（ループ回数動的制御コア） -->
    <div class="control-group">
        <h3>🎙️ ② 循環前進コントロール（音声認識）</h3>
        <p style="font-size:0.85rem; color:#8fa0c4; margin:0 0 10px 0;">「5万回ループ」「10万回」などと話しかけてください。</p>
        <label>最大連想循環回数 (MAXIMUM_RESONANCE_CYCLES):</label>
        <div style="font-size: 1.5rem; font-weight: bold; color: #ffffff;" id="loop_display">50000 回</div>
    </div>

    <!-- クラウド自動入稿トリガー -->
    <button onclick="submitToFab()">🏆 世界中の後進ファブへダイレクト自動入稿</button>

    <div id="console">>> システムブート完了。常温量子物理ファブリック待機中...</div>

<script>
    let currentLoops = 50000;
    const logBox = document.getElementById('console');

    function log(msg) {
        logBox.innerHTML += `<br>>> ${msg}`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    function updateVal(type, val) {
        document.getElementById(`${type}_val`).innerText = val;
    }

    // 音声コマンド（ループ回数の聞き取りロジック）の簡易スクリプト
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = false;
        recognition.lang = 'ja-JP';

        recognition.onresult = (event) => {
            const resultText = event.results[event.results.length - 1][0].transcript;
            log(`音声検知: "${resultText}"`);
            
            // 「○万回」の数値を抽出する簡易正規表現
            const match = resultText.match(/(\d+)\s*万/);
            if (match) {
                currentLoops = parseInt(match[1]) * 10000;
                document.getElementById('loop_display').innerText = `${currentLoops} 回`;
                log(`[確定] ループ回数を ${currentLoops} 回にリコンフィギュラブル更新しました。`);
            }
        };

        recognition.onerror = () => { recognition.start(); };
        recognition.onend = () => { recognition.start(); };
        recognition.start();
        log("音声認識コア：常時起動完了。");
    } else {
        log("警告: この端末はWeb Speech APIに対応していません。");
    }

    // クラウド側Vivado連携APIへの自動入稿キック
    async function submitToFab() {
        log("ファブ入稿プロセス始動。物理位相マップをビルド中...");
        const payload = {
            wave_m: parseInt(document.getElementById('wave_m').value),
            wave_ui: parseInt(document.getElementById('wave_ui').value),
            wave_ej: parseInt(document.getElementById('wave_ej').value),
            wave_ek: parseInt(document.getElementById('wave_ek').value),
            loops: currentLoops
        };

        try {
            const response = await fetch('/api/submit-qpu', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            if(data.success) {
                log(`祝・大勝利！ Vivado自動パッケージング完了。出力ポート: ${data.outputPath}`);
            } else {
                log(`エラー: ${data.message}`);
            }
        } catch (err) {
            log(`通信ハザード検知: ${err.message}`);
        }
    }
</script>




<!-- index.html の 4連スライダーの直下に以下を追加 -->
<div class="control-group">
    <h3>🌐 ③ 2D直交メッシュ導波路エディタ（OLSWS物理位相デザイン）</h3>
    <p style="font-size:0.85rem; color:#8fa0c4; margin:0 0 10px 0;">グリッドをタッチして、光LSI直交導波路の波の衝突ルート（位相プレーン）をスケッチしてください。</p>
    <div style="text-align: center;">
        <canvas id="mesh_canvas" width="320" height="320" style="background:#000; border: 2px solid #1f2d4d; border-radius: 8px; cursor: crosshair; box-shadow: 0 0 15px rgba(0,255,204,0.1);"></canvas>
    </div>
    <div style="margin-top: 10px; font-size: 0.85rem; color:#8fa0c4; text-align: center;">
        現在の物理アクティブ結合数: <span id="active_nodes" style="color:#00ffcc; font-weight:bold;">0</span> / 256
    </div>
</div>

<script>
    // Canvasメッシュ・物理トポロジー制御ロジック
    const canvas = document.getElementById('mesh_canvas');
    const ctx = canvas.getContext('2d');
    const gridSize = 16; // 16x16 = 256直交交差点マトリクス
    const cellSize = canvas.width / gridSize;
    let meshMatrix = Array(gridSize).fill().map(() => Array(gridSize).fill(0));

    function drawMesh() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // グリッド線（導波路）の描画
        ctx.strokeStyle = '#111b2e';
        ctx.lineWidth = 1;
        for (let i = 0; i <= gridSize; i++) {
            ctx.beginPath(); ctx.moveTo(i * cellSize, 0); ctx.lineTo(i * cellSize, canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i * cellSize); ctx.lineTo(canvas.width, i * cellSize); ctx.stroke();
        }

        // アクティブな波動結合点（FeRAM演算ノード）の描画
        let activeCount = 0;
        for (let y = 0; y < gridSize; y++) {
            for (let x = 0; x < gridSize; x++) {
                if (meshMatrix[y][x] === 1) {
                    activeCount++;
                    // 量子エンタングルメントを表現する光のパルス波をシミュレート描画
                    ctx.fillStyle = 'rgba(0, 255, 204, 0.4)';
                    ctx.beginPath(); ctx.arc(x * cellSize + cellSize/2, y * cellSize + cellSize/2, cellSize * 0.8, 0, Math.PI * 2); ctx.fill();
                    
                    ctx.fillStyle = '#00ffcc';
                    ctx.beginPath(); ctx.arc(x * cellSize + cellSize/2, y * cellSize + cellSize/2, cellSize * 0.3, 0, Math.PI * 2); ctx.fill();
                }
            }
        }
        document.getElementById('active_nodes').innerText = activeCount;
    }

    // タッチ・クリックでの直感的位相スケッチ
    function handleDraw(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = Math.floor((clientX - rect.left) / cellSize);
        const y = Math.floor((clientY - rect.top) / cellSize);
        
        if (x >= 0 && x < gridSize && y >= 0 && y < gridSize) {
            meshMatrix[y][x] = 1; // その交差点をアクティブ化（導波路結合）
            drawMesh();
        }
    }

    canvas.addEventListener('mousemove', (e) => { if(e.buttons === 1) handleDraw(e); });
    canvas.addEventListener('mousedown', handleDraw);
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handleDraw(e); }, { passive: false });
    canvas.addEventListener('touchstart', handleDraw);

    // 初期描画
    drawMesh();

    // 既存の submitToFab() 関数内の payload を以下のように拡張
    async function submitToFab() {
        log("ファブ入稿プロセス始動。物理位相マップおよびメッシュ構造をビルド中...");
        
        // 2D直交メッシュをシリアルなビットストリームに圧縮（防衛核Web3送信用）
        const meshStream = meshMatrix.flat();

        const payload = {
            wave_m: parseInt(document.getElementById('wave_m').value),
            wave_ui: parseInt(document.getElementById('wave_ui').value),
            wave_ej: parseInt(document.getElementById('wave_ej').value),
            wave_ek: parseInt(document.getElementById('wave_ek').value),
            loops: currentLoops,
            mesh_topology: meshStream // 256ビットの直交メッシュ・トポロジー
        };

        // 以降の fetch 通信処理はそのまま継続
        // ... (省略) ...
    }
</script>
</body>
</html>
