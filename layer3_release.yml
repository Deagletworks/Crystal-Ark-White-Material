name: "Layer 3: Automated Physics Test, Build & Release Pipeline"

on:
  push:
    branches:
      - main
    paths:
      - '**.py'
      - '**.c'
      - '.github/workflows/layer3_release.yml'

jobs:
  physics-validation-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # リリースタグ・アセットの書き込み権限

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # バージョニング算出のため全履歴を取得

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Validation Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy matplotlib pytest

    - name: Run Core Physics Asserts (0-Ohm & 1M-TDM Crosstalk)
      run: |
        pytest test_wave_resonance.py -v -s

    - name: Install Linux Kernel Build Essentials
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential linux-headers-generic

    - name: Compile C_ROME-OS Core Kernel Module
      run: |
        # GitHub Actions用の簡易Makefileを作成してビルドを実行
        echo "obj-m += c_rome_mhd_flux_ring_buffer.o" > Makefile
        make -C /lib/modules/$(uname -r)/build M=$PWD modules
        
        # 配布用にバイナリをリネーム・パッケージング
        mkdir -p dist/
        cp c_rome_mhd_flux_ring_buffer.ko dist/c_rome_mhd_core.ko
        tar -czvf dist/c_rome_mhd_core_x86_64.tar.gz -C dist c_rome_mhd_core.ko

    - name: Determine Next Semantic Version Tag
      id: tag_version
      uses: anothrNick/github-tag-action@1.67.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        WITH_V: true
        DEFAULT_BUMP: patch

    - name: Create GitHub Automated Release & Upload Assets
      uses: softprops/action-gh-release@v2
      if: steps:tag_version.outputs.new_tag != ''
      with:
        tag_name: ${{ steps.tag_version.outputs.new_tag }}
        name: "Release ${{ steps.tag_version.outputs.new_tag }} [Layer 3 Coherent Interface]"
        body: |
          ## 🌌 Layer 3 Coherent Subsystem Production Release
          
          This automated release indicates that the core multiferroic/TDM architecture has successfully cleared the stringent validation criteria.
          
          ### 📊 Automated Gate Checklist:
          - [x] **0.000000 Ω Spatial Impedance Convergence Test:** PASSED
          - [x] **1,000,000 Qubit TDM Slot Crosstalk Probability Threshold (< 1e-4):** PASSED
          - [x] **Kernel Module Multi-Page Ring Buffer Compilation:** SUCCESSFUL
          
          *Deploy `c_rome_mhd_core.ko` via `insmod` into the target runtime environment.*
        draft: false
        prerelease: false
        files: |
          dist/c_rome_mhd_core_x86_64.tar.gz
          docs/assets/layer3_resonance_layout.png
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
